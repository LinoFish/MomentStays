<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">MomentStays 片刻栖所 — The moment stays.</title>
  <desc id="desc">Convert Android Motion Photos and Apple Live Photos both ways on macOS, keeping the cover frame you chose. 安卓动态照片与苹果实况照片互转，封面还是你选的那一帧。</desc>
