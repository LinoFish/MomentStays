    <text x="474" y="262" font-size="50" font-weight="500" letter-spacing="3" class="muted">片刻栖所</text>
    <text x="474" y="330" font-size="38" font-weight="600" class="sub">The moment stays. <tspan class="muted" font-weight="400">留住原来的瞬间。</tspan></text>
    <text x="475" y="386" font-size="25" class="body">Android Motion Photos ⇄ Apple Live Photos on your Mac</text>
    <text x="475" y="424" font-size="22" class="muted">安卓动态照片与苹果实况照片互转，封面还是你选的那一帧</text>
