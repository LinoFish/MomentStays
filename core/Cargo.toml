[package]
name = "momentstays-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Cross-platform Motion Photo container parser for MomentStays (byte-level, no pixel decode)"
publish = false

[lib]
name = "momentstays_core"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "momentstays-core"
path = "src/bin/momentstays-core.rs"

[[bin]]
name = "momentstays-convert"
path = "src/bin/momentstays-convert.rs"

[[bin]]
name = "momentstays-driver"
path = "src/bin/momentstays-driver.rs"

[dependencies]
oxideav-h265 = "=0.0.17"
jpeg-decoder = { version = "=0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
memchr = "2"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
