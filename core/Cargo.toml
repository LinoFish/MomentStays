[package]
name = "momentstays-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Cross-platform Motion Photo container parser for MomentStays (byte-level, no pixel decode)"
publish = false

[lib]
name = "momentstays_core"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "momentstays-core"
path = "src/bin/momentstays-core.rs"

[[bin]]
name = "momentstays-convert"
path = "src/bin/momentstays-convert.rs"

[[bin]]
name = "momentstays-driver"
path = "src/bin/momentstays-driver.rs"

[dependencies]
oxideav-h265 = "=0.0.17"
jpeg-decoder = { version = "=0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
memchr = "2"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"

# Linux system codec backend (`--features linux-native`). Off by default so
# default, macOS and Windows builds need no system libraries. libjpeg-turbo
# (TurboJPEG API), lcms2 and libheif are linked dynamically via plain
# `extern "C"` declarations (see build.rs); GStreamer through gstreamer-rs.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

[features]
default = []
linux-native = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:pkg-config"]

[profile.release]
lto = true
codegen-units = 1
