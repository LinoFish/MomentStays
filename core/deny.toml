# cargo-deny configuration: dependency license policy.
# The project itself is GPL-3.0-only, but third-party crates must stay
# permissive so official app-store builds remain possible.
# See the 「依赖协议规则」 section of AGENTS.md before changing this file.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
]
# GPL, AGPL, LGPL, SSPL and other copyleft licenses are intentionally absent,
# so any crate that can only be used under them fails `cargo deny check licenses`.

# Our own crate (publish = false) is GPL-3.0-only; only third-party crates are checked.
[licenses.private]
ignore = true
