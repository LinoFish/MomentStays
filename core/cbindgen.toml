# cbindgen config for the C ABI (ROADMAP item 10). Regenerate with:
#   cd core && cbindgen --config cbindgen.toml --crate momentstays-core --output include/momentstays_core.h
# The only exported surface is src/capi.rs (three functions, primitive
# types only); the rest of the crate is Rust-ABI and is ignored.
language = "C"
include_guard = "momentstays_core_h"
header = """/* momentstays_core.h — C ABI for momentstays-core (ROADMAP item 10).
 * Generated by cbindgen from src/capi.rs; do not edit by hand.
 * Regenerate: cd core && cbindgen --config cbindgen.toml --crate momentstays-core --output include/momentstays_core.h
 *
 * Build the static library with:
 *   cargo build --release --lib        # -> target/release/libmomentstays_core.a
 * Link it from C with:
 *   cc your_program.c -Iinclude target/release/libmomentstays_core.a -lpthread -ldl -lm
 * (on macOS the -lpthread/-ldl/-lm flags are unnecessary).
 *
 * Contract (see src/capi.rs for the authoritative version):
 * - momentstays_version() returns a static NUL-terminated string that
 *   must never be freed.
 * - momentstays_inspect() returns 0 on success and stores a freshly
 *   allocated NUL-terminated JSON string in *out_json; free it with
 *   momentstays_free_string(). Any other return value is a failure and
 *   *out_json is left untouched. NULL data/out_json pointers fail
 *   instead of crashing. Invalid file bytes are NOT a failure: they
 *   produce {"ok": false, "error": "..."} JSON, like Rust `inspect`.
 * - A Rust panic inside inspect is caught at the FFI boundary and
 *   reported as failure, never unwound across FFI.
 */"""

# Whitelist: only these three functions are the C ABI. Anything else
# public in the crate stays out of the header.
[export]
include = ["momentstays_version", "momentstays_inspect", "momentstays_free_string"]
