name: rust-core
on:
  push:
    branches: [rust-core]
    paths: ["core/**", "scripts/check_rust_core.py", ".github/workflows/rust-core.yml"]
  pull_request:
    paths: ["core/**"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
        working-directory: core
      - if: matrix.os != 'windows-latest'
        run: python3 scripts/check_rust_core.py
