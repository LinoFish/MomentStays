# TEMPORARY verification workflow for branch review/ui-2026-11-27. Remove before merging.
name: review-titlebar (temporary)
on:
  push:
    branches: [review/ui-2026-11-27]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: sw_vers; xcodebuild -version; rustc --version
      - run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: build_app.sh --arm64 --diagnostics
        id: diag
        run: bash apple/macos/scripts/build_app.sh --arm64 --diagnostics
      - name: UI snapshots
        if: always() && steps.diag.outcome == 'success'
        run: |
          mkdir -p shots
          app=.build/gui/preview/MomentStays.app/Contents/MacOS/MomentStays
          snap() { name=$1; w=$2; h=$3; shift 3; perl -e "alarm 45; exec @ARGV" "$app" --ui-snapshot "$PWD/shots/$name.png" --ui-width $w --ui-height $h "$@" > "shots/$name.log" 2>&1 || echo "FAIL $name" >> shots/failures.txt; }
          for s in 1 2 3 4 5; do
            snap step$s-light 1120 700 --ui-step $s
            snap step$s-dark 1120 700 --ui-step $s --ui-appearance dark
          done
          snap step1-unconfirmed 1120 700 --ui-clear-preview
          snap step2-narrow 720 600 --ui-step 2
          snap step4-narrow 720 600 --ui-step 4
          snap step4-narrow-dark 720 600 --ui-step 4 --ui-appearance dark
          snap step2-inspector 1280 760 --ui-step 2 --ui-select-first --ui-preview
          snap step5-running 1120 700 --ui-task-phase converting --ui-progress-preview
          snap step2-recent 1120 700 --ui-step 2 --ui-recent-preview
          snap step2-library 1120 700 --ui-step 2 --ui-library-preview
          snap step2-fullscreen 1120 700 --ui-step 2 --ui-fullscreen
          ls -la shots
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob('shots/*.json')):
              d = json.load(open(f))
              fr = d.get('frames', {})
              print(f, {k: d.get(k) for k in ['titlebar_height','toolbar_style','full_screen','window_title','title_hidden','titlebar_hits','settings_sheet_visible']})
              print('   lights', d.get('traffic_lights'), 'header', fr.get('canvas-header'), 'title', fr.get('canvas-title'), 'sidebar', fr.get('sidebar-header'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots
          if-no-files-found: ignore
      - name: build_gui_tests.sh
        if: always()
        run: bash apple/macos/scripts/build_gui_tests.sh
      - name: WorkspaceModelTests (check_workspace.py)
        if: always()
        run: bash apple/macos/scripts/run_checks_with_rust.sh check_workspace.py
