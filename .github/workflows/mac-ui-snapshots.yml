name: mac-ui-snapshots
on:
  push:
    branches: [ui-layout]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo fetch --manifest-path core/Cargo.toml
      - name: Build diagnostics app
        continue-on-error: true
        run: |
          set -o pipefail
          bash apple/macos/scripts/build_app.sh --arm64 --diagnostics 2>&1 | tee build.log
      - name: Baseline (main)
        continue-on-error: true
        run: |
          git fetch -q origin main
          git worktree add -q ../base origin/main
          cd ../base
          sed -i '' 's/retry:{ _ in },remove:{ _ in \[\] })/retry:{ _ in },export:{ _ in },originals:{ _ in },remove:{ _ in [] })/' apple/macos/Sources/UISnapshotSupport.swift
          bash apple/macos/scripts/build_app.sh --arm64 --diagnostics > ../base-build.log 2>&1
      - name: Snapshots
        continue-on-error: true
        run: |
          mkdir -p shots
          snapall() { app=$1; prefix=$2
          snap() { name=$prefix$1; w=$2; h=$3; shift 3; perl -e "alarm 40; exec @ARGV" "$app" --ui-snapshot "$PWD/shots/$name.png" --ui-width $w --ui-height $h "$@" > "shots/$name.log" 2>&1 || echo "FAIL $name" >> shots/failures.txt; }
          snap wide 1120 700
          snap wide-preview 1120 700 --ui-preview --ui-select-first
          snap wide-checked 1120 700 --ui-check-first --ui-select-first
          snap medium 760 600
          snap compact 390 540 --ui-select-first
          snap empty 760 600 --ui-fixtures 0
          snap unset 1120 700 --ui-fixtures 0 --ui-clear-preview
          snap progress 1120 700 --ui-progress-preview
          snap dark-reverse 1120 700 --direction to-android --ui-appearance dark
          snap list 1120 700 --ui-list
          snap filtered-empty 760 600 --ui-scope completed
          snap settings 1120 700 --ui-expand-settings
          snap detail 1120 700 --ui-select-first --ui-detail
          snap monitor 1120 700 --ui-monitoring-preview
          }
          snapall .build/gui/preview/MomentStays.app/Contents/MacOS/MomentStays ""
          snapall ../base/.build/gui/preview/MomentStays.app/Contents/MacOS/MomentStays "base-"
      - name: UI checks
        continue-on-error: true
        run: |
          set -o pipefail
          python3 apple/macos/scripts/check_swiftui_ui.py 2>&1 | tee ui-check.log
      - name: Publish
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          src=$PWD
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q
          git config user.name ui-snapshots-bot; git config user.email actions@users.noreply.github.com
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ui-snapshots; then git checkout -q -b ui-snapshots FETCH_HEAD; else git checkout -q --orphan ui-snapshots; fi
          rm -rf "$sha"; mkdir -p "$sha"
          cp "$src"/build.log "$src"/ui-check.log "$src"/../base-build.log "$sha"/ 2>/dev/null || true
          cp "$src"/shots/*.log "$src"/shots/failures.txt "$sha"/ 2>/dev/null || true
          for f in "$src"/shots/*.png; do [ -f "$f" ] && sips -Z 1400 "$f" --out "$sha/$(basename "$f")" >/dev/null; done
          ls -la "$sha"
          git add -A && git commit -q -m "snapshots $sha" && git push -q origin ui-snapshots
