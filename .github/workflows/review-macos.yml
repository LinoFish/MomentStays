# TEMPORARY review workflow for branch review/macos-2026-11-24.
# Remove before merging to main.
name: review-macos (temporary)
on:
  push:
    branches: [review/macos-2026-11-24]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: build_app.sh (universal release)
        run: bash apple/macos/scripts/build_app.sh
      - name: build_app.sh --arm64 --diagnostics
        if: always()
        run: bash apple/macos/scripts/build_app.sh --arm64 --diagnostics
      - name: xcodebuild MomentStays-macOS (Debug)
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project apple/macos/MomentStays.xcodeproj -scheme MomentStays-macOS -configuration Debug \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build 2>&1 | tail -n 120
      - name: Environment
        run: |
          sw_vers; uname -m; xcodebuild -version; swift --version; rustc --version
          /usr/bin/arch -x86_64 /usr/bin/true && echo "Rosetta OK" || echo "Rosetta missing"
      - run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: build_gui_tests.sh
        if: always()
        run: bash apple/macos/scripts/build_gui_tests.sh
      - name: build_backend.sh
        if: always()
        run: bash apple/macos/scripts/build_backend.sh
      - name: Swift tests - PhotoTimeRepair
        if: always()
        run: bash apple/macos/scripts/check_photo_time_repair.sh
      - name: Swift tests - MotionPreview
        if: always()
        run: bash apple/macos/scripts/check_motion_preview.sh
      - name: Swift tests - InputScan
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .build/ci-fixture
          printf '%s' '{"mode":"fixture","folder":"'"$PWD"'/.build/ci-fixture"}' | .build/gui/native-tests > .build/ci-fixture/fixture.json
          cd apple/macos/scripts
          python3 - <<'PY'
          import json
          from pathlib import Path
          from testkit.fixtures import motion
          root = Path('../../../.build/ci-fixture')
          stamp = json.loads((root/'fixture.json').read_text())['cover_us']
          (root/'google-motion.jpg').write_bytes(motion((root/'still.jpg').read_bytes(), str(stamp), movie=(root/'clip.mp4').read_bytes()))
          PY
          cd ../../..
          # The script's --fixture production check expects a real Google Pixel Motion Photo
          # (private local sample); the synthetic fixture is rejected by the Google->Honor
          # route. Build via the script, then run the model regressions without --fixture.
          bash apple/macos/scripts/check_input_scan.sh .build/ci-fixture/google-motion.jpg || echo "production --fixture check needs a real Google sample (informational)"
          run_dir=$(mktemp -d "$PWD/.build/input-scan-fix/ci.XXXXXX")
          .build/input-scan-fix/model-tests-fixed "$run_dir"
      - name: Swift tests - WorkspaceModelTests (check_workspace.py)
        if: always()
        run: bash apple/macos/scripts/run_checks_with_rust.sh check_workspace.py
      - name: Python checks that run without local samples
        if: always()
        run: |
          bash apple/macos/scripts/run_checks_with_rust.sh check_cover_candidates.py check_existing_output.py \
            check_extended.py check_honor_orientation.py check_huawei.py check_video_metadata.py
      - name: Rust bridge parity (check_rust_core.py)
        if: always()
        run: python3 apple/macos/scripts/check_rust_core.py --swift .build/backend/native-tests
      - name: Informational - remaining checks (need local samples or stale vs core; not gating)
        if: always()
        continue-on-error: true
        run: |
          bash apple/macos/scripts/run_checks_with_rust.sh check_gui_engine.py check_android_transfer.py check_apple_hdr.py \
            check_auxiliary.py check_batch_performance.py check_honor_private_hdr.py check_multi_import.py \
            check_optional_data_and_vendor.py check_output_names.py check_reverse.py check_reverse_heic.py \
            check_samsung_heic.py check_vendors.py check_xiaomi.py
