# TEMPORARY verification workflow for branch review/ui-2026-11-27. Remove before merging.
name: review-livebadge (temporary)
on:
  push:
    branches: [review/ui-2026-11-27]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: sw_vers; xcodebuild -version; rustc --version
      - run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: build_app.sh --arm64 --diagnostics
        id: diag
        run: bash apple/macos/scripts/build_app.sh --arm64 --diagnostics
      - name: Step-2 UI snapshots
        if: always() && steps.diag.outcome == 'success'
        run: |
          mkdir -p shots
          app=.build/gui/preview/MomentStays.app/Contents/MacOS/MomentStays
          snap() { name=$1; w=$2; h=$3; shift 3; perl -e "alarm 40; exec @ARGV" "$app" --ui-snapshot "$PWD/shots/$name.png" --ui-width $w --ui-height $h "$@" > "shots/$name.log" 2>&1 || echo "FAIL $name" >> shots/failures.txt; }
          snap step2-light 1120 700 --ui-step 2
          snap step2-dark 1120 700 --ui-step 2 --ui-appearance dark
          snap step2-narrow 720 600 --ui-step 2
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: shots
          if-no-files-found: ignore
      - name: build_gui_tests.sh
        if: always()
        run: bash apple/macos/scripts/build_gui_tests.sh
      - name: WorkspaceModelTests (check_workspace.py)
        if: always()
        run: bash apple/macos/scripts/run_checks_with_rust.sh check_workspace.py
