[package]
name = "momentstays-gnome"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "MomentStays (留刻) GNOME app: Android Motion Photos <-> Apple Live Photos"
publish = false
rust-version = "1.85"

[[bin]]
name = "momentstays"
path = "src/main.rs"

[dependencies]
momentstays-core = { path = "../core" }
# gtk4-rs / libadwaita-rs: MIT bindings; GTK and libadwaita themselves (LGPL)
# come from the org.gnome.Platform runtime and are linked dynamically.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
# Runs glib-compile-resources (from the GNOME SDK) for data/*.gresource.xml.
glib-build-tools = "0.22"

[features]
default = ["linux-native"]
# Linux system codec backend of the core (libjpeg-turbo, lcms2, libheif and
# GStreamer from the GNOME runtime, linked dynamically). On by default: the
# app ships only as a Flatpak on org.gnome.Platform//50, which has them all.
# `--no-default-features` builds the app without system codecs.
linux-native = ["momentstays-core/linux-native"]

[profile.release]
lto = "thin"
codegen-units = 1
