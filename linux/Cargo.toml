[package]
name = "momentstays-gnome"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "MomentStays (留刻) GNOME app: Android Motion Photos <-> Apple Live Photos"
publish = false
rust-version = "1.85"

[[bin]]
name = "momentstays"
path = "src/main.rs"

[dependencies]
momentstays-core = { path = "../core" }
# gtk4-rs / libadwaita-rs: MIT bindings; GTK and libadwaita themselves (LGPL)
# come from the org.gnome.Platform runtime and are linked dynamically.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
# Runs glib-compile-resources (from the GNOME SDK) for data/*.gresource.xml.
glib-build-tools = "0.22"

[features]
default = []
# Linux system codec backend (libjpeg-turbo, lcms2, libheif, GStreamer from the
# GNOME runtime). TODO(PR #15): `momentstays-core` on main has no
# `linux-native` feature yet. Once feat/linux-core is merged, change this line to
#     linux-native = ["momentstays-core/linux-native"]
# and add "linux-native" to `default` (and to the Flatpak build command).
linux-native = []

[profile.release]
lto = "thin"
codegen-units = 1
